[project]
name = "meridian-datagen"
version = "0.1.0"
description = "Calibrated synthetic data generator for the Trade Cost Explain demo (Meridian Group, synthetic)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "faker>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian_datagen"]
