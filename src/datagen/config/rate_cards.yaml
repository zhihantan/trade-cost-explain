# Canonical rate cards: the single source of truth for (1) the rate-card PDFs, (2) the analyst-approved
# fee schedule, and (3) the generator's expected-cost engine.
# All venues, CCPs and brokers are FICTIONAL. Fee structures are modelled on public HKEX, SGX, ASX and NSE/BSE
# schedules, but rates are illustrative. Planted changes (PRX Tech discount ending 31-Aug-2026, IGX uniform
# charge from 1-Sep-2026) are NOT real exchange or regulator actions.
#
# Line fields
#   cost_type      EXCHANGE | CLEARING | SETTLEMENT | LEVY | TAX | BROKERAGE | FIXED
#   fee_basis      PER_CONTRACT_SIDE | BPS_NOTIONAL | PER_TRADE | PER_INSTRUCTION | PER_MILLION_NOTIONAL | FIXED_MONTHLY
#   capacity       ALL | HOUSE | CLIENT | MM | NON_MM (= HOUSE + CLIENT) | PRINCIPAL (= HOUSE + MM)
#   side           ALL | BUY | SELL
#   rate           currency units per contract-side / trade / instruction / million; basis points for BPS_NOTIONAL;
#                  currency per month for FIXED_MONTHLY
#   tier_basis     NONE | VENDOR_MONTHLY_TURNOVER_USD | MEMBER_MONTHLY_TURNOVER_LCY
#   pass_through   statutory levy / tax collected on behalf of a regulator or government: recharged to clients
#                  on CLIENT capacity (is_recoverable), borne by Meridian on HOUSE / MM capacity
#   gst_rate / gst_recoverable_pct   GST charged on the fee and the share Meridian can recover
defaults:
  capacity: ALL
  side: ALL
  tier_basis: NONE
  pass_through: false
  is_discount_or_waiver: false
  gst_rate: 0.0
  gst_recoverable_pct: 0.0
  effective_from: "2025-01-01"
  effective_to: null

