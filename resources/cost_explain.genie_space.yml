# Genie space "Trade Cost Explain — APAC Global Markets" (talk-track scene 2: ask-anything on the governed cost bridge).
# The definition (sources, column metadata, instructions, examples, benchmarks) is generated by src/genie/build_space.py
# into src/genie/trade_cost_explain.geniespace.json and inlined into serialized_space at deploy.
# The space already exists in the workspace (id 01f1cda9f4a9153882ea4c4ecda34bc3). Before the next deploy, rename
# this file to cost_explain.genie_space.yml and run
#   databricks bundle deployment bind trade_cost_explain_genie 01f1cda9f4a9153882ea4c4ecda34bc3 --profile fe-vm-zh-serverless
# so the bundle adopts the existing space instead of creating a second copy (see docs/GENIE.md).
# parent_path is immutable and must stay the existing space's folder (the API reports it as /Shared/trade-cost-explain).
resources:
  genie_spaces:
    trade_cost_explain_genie:
      title: "Trade Cost Explain — APAC Global Markets"
      description: >-
        Explains APAC Global Markets trade costs (US GAAP line 'Commissions and floor brokerage', net borne, US$) for
        FP&A, Product Control and Operations: the period-on-period cost bridge (volume, mix, rate, fails, timing / accrual,
        FX, fixed fees, unexplained), desk KPIs versus plan, invoice reconciliation against contracted rates,
        settlement-fail hotspots and fee-schedule events. Fiscal year April–March. Synthetic data — Meridian Group; all
        figures illustrative.
      warehouse_id: ${resources.sql_warehouses.cost_explain_wh.id}
      file_path: ../src/genie/trade_cost_explain.geniespace.json
      parent_path: /Workspace/Shared/trade-cost-explain
      permissions:
        - group_name: users
          level: CAN_RUN
