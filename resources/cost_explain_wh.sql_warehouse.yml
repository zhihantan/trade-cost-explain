# Dedicated serverless warehouse for the dashboard, Genie, the app and the tie-out tests.
resources:
  sql_warehouses:
    cost_explain_wh:
      name: cost-explain-wh
      cluster_size: Small
      min_num_clusters: 1
      max_num_clusters: 2
      auto_stop_mins: 30
      enable_serverless_compute: true
      enable_photon: true
      warehouse_type: PRO
      channel:
        name: CHANNEL_NAME_CURRENT
      tags:
        custom_tags:
          - key: project
            value: trade-cost-explain
